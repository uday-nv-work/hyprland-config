# Decoration Settings

# Hyprland Wiki Links
# Animation - https://wiki.hyprland.org/Configuring/Animations/
# Decoration - https://wiki.hyprland.org/Configuring/Variables/#decoration

# Sourcing colors generated by wallust
source = $HOME/.config/hypr/wallust/wallust-hyprland.conf

general {
  # Material Design: thin accent border, generous outer gap
  border_size = 2
  gaps_in = 4
  gaps_out = 10

  col.active_border = $color4 $color6 45deg
  col.inactive_border = rgba(00000040)
}

# Material Design: 16px rounding + soft elevation shadow
decoration {
  rounding = 16

  active_opacity = 0.95
  inactive_opacity = 0.95
  fullscreen_opacity = 1.0

  dim_inactive = true
  dim_strength = 0.15
  dim_special = 0.6

  drop_shadow = true
  shadow_range = 18
  shadow_render_power = 3
  col.shadow = rgba(00000099)
  col.shadow_inactive = rgba(00000055)

  blur {
    enabled = true
    size = 8
    passes = 3
    ignore_opacity = false
    new_optimizations = true
    xray = false
    special = true
  }
}

group {
  col.border_active = $color15

	groupbar {
		col.active = $color0
  }
}

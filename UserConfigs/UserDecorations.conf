# Decoration Settings

# Hyprland Wiki Links
# Animation - https://wiki.hyprland.org/Configuring/Animations/
# Decoration - https://wiki.hyprland.org/Configuring/Variables/#decoration

# Sourcing colors generated by wallust
source = $HOME/.config/hypr/wallust/wallust-hyprland.conf

general {
  border_size = 3
  gaps_in = 2
  gaps_out = 4

  col.active_border = $color4 $color6 45deg
  col.inactive_border = rgba(00000060)
}

# Border radius
decoration {
  rounding = 5
         
  active_opacity = 2.0
  inactive_opacity = 1.3
  fullscreen_opacity = 1.0

  dim_inactive = true
  dim_strength = 0.25
  dim_special = 0.8

  drop_shadow = true
  shadow_range = 6
  shadow_render_power = 1
  col.shadow = $color0
  col.shadow_inactive = $color2

  blur {
  	enabled = true	
  	size = 6
  	passes = 2
  	# ignore_opacity = true
  	ignore_opacity = false
  	new_optimizations = true
  	special = true
  }
}

group {
  col.border_active = $color15

	groupbar {
		col.active = $color0
  }
}
